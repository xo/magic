version: "2"

# The linters of the go-pedantry skill, for golangci-lint 2 (D56). gosimple is
# part of staticcheck in version 2, and usetesting takes the place of tenv.
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - errorlint
    - nilerr
    - wrapcheck
    - prealloc
    - unconvert
    - usetesting
  settings:
    # An error of a package of this module needs no wrap to cross into
    # another one.
    wrapcheck:
      ignore-package-globs:
        - github.com/xo/magic/*
    staticcheck:
      checks:
        - all
        # The engine keeps each condition of libmagic as C writes it (D34).
        - -QF1001
        # The defaults of staticcheck leave these out.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    paths:
      # Copies of compress/bzip2 and of the inflater of compress/flate of the
      # Go standard library, changed in a few places for the walker. They
      # keep the style of the standard library.
      - walk/internal/bzip2
      - walk/internal/flate
