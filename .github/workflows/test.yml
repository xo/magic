name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native build + test on every platform that has a hosted runner. The
  # prebuilt archives under libmagic/ are static, so there is nothing to
  # install -- but each platform has its own #cgo LDFLAGS line, and the only
  # way to know a line is complete is to link it.
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux/amd64, os: ubuntu-latest}
          # Hosted arm64 Linux. Free for public repos; private repos need a
          # paid plan, in which case drop this entry.
          - {name: linux/arm64, os: ubuntu-24.04-arm}
          - {name: macos/amd64, os: macos-13}
          - {name: macos/arm64, os: macos-14}
          - {name: windows/amd64, os: windows-latest}
          # Hosted arm64 Windows. The runner has no arm64 mingw-w64, so
          # llvm-mingw is the C compiler. The archives came from zig, and zig
          # for arm64 Windows crashed on the runner (exit 0xc0000005) while it
          # built runtime/cgo. Go does not support -race on windows/arm64.
          - {name: windows/arm64, os: windows-11-arm, llvm: true, norace: true}
    env:
      CC: ${{ matrix.llvm && 'aarch64-w64-mingw32-clang' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install llvm-mingw (Windows arm64)
        if: matrix.llvm
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download 20261006 -R mstorsjo/llvm-mingw -p 'llvm-mingw-*-ucrt-aarch64.zip' -D $dir
          Expand-Archive -Path (Join-Path $dir 'llvm-mingw-*-ucrt-aarch64.zip') -DestinationPath $dir
          $bin = (Get-ChildItem -Directory $dir | Where-Object { $_.Name -like 'llvm-mingw-*' } | Select-Object -First 1).FullName + '\bin'
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # The runner images ship mingw-w64, but where gcc lands has moved
      # around, so find it rather than assume it is on PATH.
      - name: Locate a C compiler (Windows)
        if: runner.os == 'Windows' && !matrix.llvm
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { exit 0 }
          $cands = @(
            'C:\mingw64\bin',
            'C:\ProgramData\mingw64\mingw64\bin',
            'C:\Strawberry\c\bin'
          ) | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') }
          if ($cands.Count -eq 0) {
            choco install -y --no-progress mingw
            $cands = @('C:\ProgramData\mingw64\mingw64\bin')
          }
          $cands[0] | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Environment
        shell: bash
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version || cc --version || true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race is what backs the "safe to share a handle" claim in the docs:
      # TestConcurrent drives one cookie from 16 goroutines.
      - name: Test
        run: go test ${{ !matrix.norace && '-race' || '' }} -count=1 -v ./...

      - name: Smoke test cmd/file
        run: go run ./cmd/file testdata/gif.gif testdata/utf8.txt testdata/xlsx.xlsx
