name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package is pure Go (D22), so each runner tests it with cgo off, as a
  # program that imports it builds.
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux/amd64, os: ubuntu-latest}
          # Hosted arm64 Linux. Free for public repos; private repos need a
          # paid plan, in which case drop this entry.
          - {name: linux/arm64, os: ubuntu-24.04-arm}
          # GitHub retired macos-13 and macos-14.
          - {name: macos/amd64, os: macos-15-intel}
          - {name: macos/arm64, os: macos-latest}
          - {name: windows/amd64, os: windows-latest}
          # Go does not support -race on windows/arm64.
          - {name: windows/arm64, os: windows-11-arm, norace: true}
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # gofmt and the linters give the same answer on every runner, so one
      # runner runs them (D54, D56).
      - name: Check the format
        if: ${{ matrix.name == 'linux/amd64' }}
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Lint
        if: ${{ matrix.name == 'linux/amd64' }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...
          (cd compress/xz && golangci-lint run ./...)
          (cd compress/zstd && golangci-lint run ./...)

      - name: Vet
        run: go vet ./...

      # compress/xz and compress/zstd are modules of their own (D45).
      - name: Vet the decoder modules
        run: |
          (cd compress/xz && go vet ./...)
          (cd compress/zstd && go vet ./...)

      - name: Test without cgo
        run: go test -count=1 -v ./...

      # -race needs cgo. TestConcurrent detects from 16 goroutines at once.
      - name: Test with the race detector
        if: ${{ !matrix.norace }}
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Smoke test cmd/file
        run: go run ./cmd/file testdata/gif.gif testdata/utf8.txt testdata/xlsx.xlsx

  # A program that imports magic builds for every target of Go. This builds
  # the packages for targets that have no runner.
  cross:
    name: build for other targets
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          for t in freebsd/amd64 freebsd/arm64 openbsd/amd64 netbsd/amd64 \
            linux/386 linux/arm linux/riscv64 linux/ppc64le linux/s390x \
            linux/loong64 windows/386 android/arm64 js/wasm wasip1/wasm; do
            echo "$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done

  # The harness of the port (D30, docs/PLAN.md): the oracle is libmagic built
  # from file at the base commit against glibc (D33), and the test module
  # compares the port with it.
  oracle:
    name: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The tools that make file systems, and 7-Zip, are the oracles of the
      # files that binwalk extracts with programs (docs/WALKER.md).
      - name: Install the tools that build file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool make \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev \
            squashfs-tools util-linux-extra xorriso genisoimage \
            dosfstools mtools e2fsprogs 7zip

      - name: Check out file
        run: git clone --filter=blob:none https://github.com/file/file.git upstream/file

      - name: Build the oracle
        run: test/oracle/build.sh

      # The oracle of the walker is binwalk 3, built with cargo, which the
      # runner has (D49).
      - name: Check out binwalk
        run: git clone --filter=blob:none https://github.com/ReFirmLabs/binwalk.git upstream/binwalk

      # cargo builds binwalk from its source, which takes many minutes. The
      # build folder is kept between runs, for the commit that the ledger
      # names.
      - name: Cache the build of binwalk
        uses: actions/cache@v4
        with:
          path: |
            test/.binwalk/target
            ~/.cargo/registry
            ~/.cargo/git
          key: binwalk-${{ runner.os }}-${{ hashFiles('docs/upstream/upstreams.tsv') }}

      - name: Build the oracle of the walker
        run: test/oracle/build-binwalk.sh

      # The oracle is a program of its own, built with cgo. The test module is
      # pure Go.
      - name: Vet the test module
        working-directory: test
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Test the oracle and the gates of the port
        working-directory: test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./...

      - name: Check that the table of the rules is current
        run: |
          (cd internal/table && go generate)
          git diff --exit-code internal/table/rules.flate

      - name: Test the ledger against upstream
        run: go test -count=1 -run TestTheLedgerIsComplete -v .
